<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position</title>
    <style>
      /* ccs position, by default is static */
      .parent {
        border: 2px solid;
        position: static; /*this is default*/

        position: relative;
        /* position: fixed; */

        /* width: 100%; */
        /* top: 20px; */
        /* left: 0; */
        /* left: 100px; */
        /* right: 100px; */
        /* top: 100px; */
        /* bottom: 50px; */
        z-index: 0; /* default value is 0*/
      }

      .child {
        background-color: skyblue;
        width: 50px;
        height: 50px;
        position: absolute;
      }

      .child:first-child {
        z-index: 10;
      }

      .child:nth-child(2) {
        background-color: teal;
        /* position: absolute; */
        /* position: sticky; */
        /* width: 50%; */
        /* top: 0; */
        left: 10px;
        top: 10px;
        z-index: -2;
      }

      .child:nth-child(3) {
        background-color: orangered;
        left: 20px;
        top: 20px;
      }

      .child:last-child {
        background-color: darkorchid;
        left: 30px;
        top: 30px;
        z-index: -1;
      }

      main {
        height: 1000px;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="child">1</div>
      <div class="child">2</div>
      <div class="child">3</div>
      <div class="child">4</div>
    </div>

    <main>
      <h1>some header</h1>
    </main>
  </body>
</html>
